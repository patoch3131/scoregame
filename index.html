<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="compteur.png">
<title>Pointage</title>
<style>
:root{--bg:#f3f1ee;--fg:#16151a;--panel:#fff;--line:#d9d5cf;--mut:#6d6a72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--fg:#f2f0ee;--panel:#1a1a20;--line:#2b2b33;--mut:#9a98a2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d10;--fg:#f2f0ee;--panel:#1a1a20;--line:#2b2b33;--mut:#9a98a2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.3 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px}
#title{flex:1;text-align:left;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:600}
.ic:disabled{opacity:.35}
#board{flex:1;display:grid;gap:8px;padding:0 12px 8px;min-height:0}
.t{position:relative;border-radius:22px;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;touch-action:none;cursor:grab;min-height:0;overflow:hidden}
.t.r{transform:rotate(180deg)}
.t .n{font-weight:600;font-size:17px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .s{font-weight:800;font-size:clamp(52px,17vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.t .m{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:50%;background:#0002;font-size:26px;font-weight:700}
.t .d{position:absolute;top:8px;left:12px;font-weight:700;opacity:.6;font-size:15px}
footer{display:flex;gap:6px;padding:4px 12px 10px;justify-content:center}
.ch{flex:1;max-width:80px;padding:12px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.ch[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}
#sheet.o{display:flex}
#panel{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input[type=text],input[type=number]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;flex:none}
.sw.on{border-color:var(--fg)}
.pc{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.p{background:var(--fg);color:var(--bg)}
.g{flex:1;text-align:left;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.g.on{border-color:var(--fg);font-weight:700}
.sp{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.t .s{transition:transform .08s}.t:active .s{transform:scale(.94)}}
</style>
</head>
<body>
<header>
  <button id="title" aria-label="Parties et réglages"></button>
  <button class="ic" id="undo">Annuler</button>
  <button class="ic" id="set" aria-label="Réglages">Réglages</button>
</header>
<main id="board"></main>
<footer id="inc"></footer>
<div id="sheet"><div id="panel" role="dialog" aria-label="Réglages"></div></div>
<script>
var COL=["#ff6b6b","#ffb347","#f7e463","#5ee08a","#3fd6c4","#59a8ff","#a99bff","#f477b8"];
var INC=[1,5,10,25];
function mk(name,n){var ps=[];for(var i=0;i<n;i++)ps.push({n:"Joueur "+(i+1),c:COL[i%8],s:0});return{id:Date.now()+Math.random(),name:name,inc:1,face:true,players:ps,hist:[]}}
function load(){try{var d=JSON.parse(localStorage.getItem("pointage"));if(d&&d.games&&d.games.length)return d}catch(e){}return null}
var S=load()||{cur:0,games:[mk("Partie 1",2)]};
function save(){try{localStorage.setItem("pointage",JSON.stringify(S))}catch(e){}}
function g(){return S.games[S.cur]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(id){return document.getElementById(id)};

function board(){
  var G=g(),n=G.players.length,cols=n<=2?1:2,rows=Math.ceil(n/cols);
  var b=$("board");
  b.style.gridTemplateColumns="repeat("+cols+",1fr)";
  b.style.gridTemplateRows="repeat("+rows+",1fr)";
  b.innerHTML=G.players.map(function(p,i){
    var r=G.face&&n>1&&Math.floor(i/cols)<Math.floor(rows/2);
    return '<div class="t'+(r?' r':'')+'" style="background:'+p.c+'" data-i="'+i+'" role="button" tabindex="0" aria-label="'+esc(p.n)+' : '+p.s+' points, ajouter '+G.inc+'">'
      +'<div class="n">'+esc(p.n)+'</div><div class="s">'+p.s+'</div><div class="d"></div>'
      +'<button class="m" data-m="'+i+'" aria-label="Retirer '+G.inc+' à '+esc(p.n)+'">−</button></div>';
  }).join("");
  $("title").textContent=G.name;
  $("undo").disabled=!G.hist.length;
  var opts=INC.slice();if(opts.indexOf(G.inc)<0)opts.push(G.inc);
  $("inc").innerHTML=opts.map(function(v){return '<button class="ch" data-v="'+v+'" aria-pressed="'+(v===G.inc)+'">+'+v+'</button>'}).join("");
}
function add(i,d){var G=g();G.players[i].s+=d;G.hist.push({i:i,d:d});save();board()}
$("board").addEventListener("click",function(e){
  var m=e.target.closest("[data-m]");
  if(m){add(+m.dataset.m,-g().inc);return}
});
(function(){
var A=null,STEP=30;
function ang(e,c){return Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI}
$("board").addEventListener("pointerdown",function(e){
  if(e.target.closest("[data-m]"))return;
  var t=e.target.closest(".t");if(!t)return;
  var r=t.getBoundingClientRect(),c={x:r.left+r.width/2,y:r.top+r.height/2};
  A={t:t,i:+t.dataset.i,c:c,last:ang(e,c),acc:0,steps:0,dist:0,x:e.clientX,y:e.clientY,rot:t.classList.contains("r")};
  try{t.setPointerCapture(e.pointerId)}catch(x){}
});
$("board").addEventListener("pointermove",function(e){
  if(!A)return;
  A.dist+=Math.abs(e.clientX-A.x)+Math.abs(e.clientY-A.y);A.x=e.clientX;A.y=e.clientY;
  var a=ang(e,A.c);
  if(Math.hypot(e.clientX-A.c.x,e.clientY-A.c.y)<24){A.last=a;return}
  var d=a-A.last;
  if(d>180)d-=360;if(d<-180)d+=360;
  A.last=a;A.acc+=A.rot?-d:d;
  var n=Math.trunc(A.acc/STEP);
  if(n){A.acc-=n*STEP;A.steps+=n;
    var G=g(),p=G.players[A.i];p.s+=n*G.inc;
    A.t.querySelector(".s").textContent=p.s;
    var v=A.steps*G.inc;A.t.querySelector(".d").textContent=(v>0?"+":"")+v}
});
function end(cancel){
  if(!A)return;var a=A;A=null;var G=g();
  if(a.steps){G.hist.push({i:a.i,d:a.steps*G.inc})}
  else if(!cancel&&a.dist<10){G.players[a.i].s+=G.inc;G.hist.push({i:a.i,d:G.inc})}
  save();board();
}
$("board").addEventListener("pointerup",function(){end(false)});
$("board").addEventListener("pointercancel",function(){end(true)});
})();
$("board").addEventListener("keydown",function(e){
  var t=e.target.closest(".t");
  if(t&&e.target===t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();add(+t.dataset.i,g().inc)}
});
$("inc").addEventListener("click",function(e){var c=e.target.closest("[data-v]");if(c){g().inc=+c.dataset.v;save();board()}});
$("undo").onclick=function(){var G=g(),h=G.hist.pop();if(h){G.players[h.i].s-=h.d;save();board()}};

function sheet(){
  var G=g();
  var h='<h2>Partie</h2><div class="row"><input type="text" id="gn" value="'+esc(G.name)+'" aria-label="Nom de la partie"></div>';
  h+='<h2>Joueurs ('+G.players.length+'/12)</h2>';
  h+=G.players.map(function(p,i){
    return '<div class="row"><input type="text" data-pn="'+i+'" value="'+esc(p.n)+'" aria-label="Nom du joueur '+(i+1)+'">'
      +(G.players.length>1?'<button class="btn" data-del="'+i+'" aria-label="Supprimer '+esc(p.n)+'">Retirer</button>':'')+'</div>'
      +'<div class="row"><div class="pc">'+COL.map(function(c){return '<button class="sw'+(c===p.c?' on':'')+'" style="background:'+c+'" data-pc="'+i+'" data-c="'+c+'" aria-label="Couleur"></button>'}).join("")+'</div></div>';
  }).join("");
  if(G.players.length<12)h+='<div class="row"><button class="btn" id="addp">Ajouter un joueur</button></div>';
  h+='<h2>Points</h2><div class="row"><input type="number" id="ci" min="1" value="'+G.inc+'" aria-label="Incrément"><button class="btn" id="face" aria-pressed="'+G.face+'">Scores face aux joueurs : '+(G.face?'oui':'non')+'</button></div>';
  h+='<div class="row"><button class="btn" id="rz">Remettre les scores à zéro</button></div>';
  h+='<h2>Parties enregistrées</h2>'+S.games.map(function(x,i){
    return '<div class="row"><button class="g'+(i===S.cur?' on':'')+'" data-go="'+i+'">'+esc(x.name)+'</button>'+(S.games.length>1?'<button class="btn" data-dg="'+i+'" aria-label="Supprimer '+esc(x.name)+'">Supprimer</button>':'')+'</div>';
  }).join("");
  h+='<div class="sp" style="margin-top:12px"><button class="btn" id="ng">Nouvelle partie</button><button class="btn p" id="ok">Terminé</button></div>';
  $("panel").innerHTML=h;
}
function open(){sheet();$("sheet").classList.add("o")}
function close(){$("sheet").classList.remove("o");board()}
$("set").onclick=open;$("title").onclick=open;
$("sheet").addEventListener("click",function(e){
  var t=e.target,G=g();
  if(t.id==="sheet"||t.id==="ok"){close();return}
  var el;
  if(el=t.closest("[data-del]")){G.players.splice(+el.dataset.del,1);G.hist=[]}
  else if(el=t.closest("[data-pc]")){G.players[+el.dataset.pc].c=el.dataset.c}
  else if(t.id==="addp"){var k=G.players.length;G.players.push({n:"Joueur "+(k+1),c:COL[k%8],s:0})}
  else if(t.id==="face"){G.face=!G.face}
  else if(t.id==="rz"){G.players.forEach(function(p){p.s=0});G.hist=[]}
  else if(el=t.closest("[data-go]")){S.cur=+el.dataset.go}
  else if(el=t.closest("[data-dg]")){var d=+el.dataset.dg;S.games.splice(d,1);if(S.cur>=S.games.length)S.cur=S.games.length-1;else if(S.cur>d)S.cur--}
  else if(t.id==="ng"){S.games.push(mk("Partie "+(S.games.length+1),G.players.length));S.cur=S.games.length-1}
  else return;
  save();board();sheet();
});
$("sheet").addEventListener("input",function(e){
  var t=e.target,G=g();
  if(t.id==="gn")G.name=t.value||"Partie";
  else if(t.dataset.pn!==undefined)G.players[+t.dataset.pn].n=t.value;
  else if(t.id==="ci"){var v=parseInt(t.value,10);if(v>0)G.inc=v}
  else return;
  save();board();
});
board();
</script>
</body>
</html>
